<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>柔道ノート Judo Note</title>
<meta name="theme-color" content="#eef0f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="柔道ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ── トークン：ガラス（Liquid Glass）。色(--acc-*)と背景の光(--b1..3)は個人設定でJSが差し替える ── */
:root{
  --acc-l:#3552d4; --acc-d:#8ea2ff; --acc-2:#8b5cf6;
  --b1:rgba(129,140,248,.55); --b2:rgba(196,181,253,.50); --b3:rgba(125,211,252,.40);
  --accent:var(--acc-l);
  --grad:linear-gradient(135deg,var(--accent),var(--acc-2));
  --tint:color-mix(in srgb,var(--accent) 13%,transparent);
  --text:#151827; --dim:#5b6072; --faint:#8a8fa0;
  --base:#eef0f6;
  --panel:rgba(255,255,255,.62); --panel2:rgba(255,255,255,.46); --glass:rgba(255,255,255,.58);
  --glass-bd:rgba(255,255,255,.78); --hi:inset 0 1px 0 rgba(255,255,255,.9);
  --shadow:0 10px 34px rgba(40,50,90,.14); --line:rgba(30,40,80,.10); --line2:rgba(30,40,80,.20);
  --good:#1f8a4c; --good-s:rgba(31,138,76,.13); --warn:#b86e00; --warn-s:rgba(214,138,0,.15); --bad:#cf3434; --bad-s:rgba(207,52,52,.12);
  --blob-op:1; --frost:26px; --radius:20px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Helvetica Neue",sans-serif;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  /* 印刷用の紙（テーマに関係なく常に白い紙） */
  --s-paper:#ffffff; --s-ink:#16181f; --s-dim:#5a5f6b; --s-line:#cfd2d9; --s-soft:#f3f4f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --accent:var(--acc-d); --text:#eef0f8; --dim:#a9afc2; --faint:#767c8f; --base:#0b0d15;
    --panel:rgba(26,30,44,.58); --panel2:rgba(255,255,255,.07); --glass:rgba(14,16,26,.66);
    --glass-bd:rgba(255,255,255,.14); --hi:inset 0 1px 0 rgba(255,255,255,.08);
    --shadow:0 12px 40px rgba(0,0,0,.5); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.2);
    --good:#5fd18c; --good-s:rgba(95,209,140,.15); --warn:#f2b451; --warn-s:rgba(242,180,81,.15); --bad:#ff7a7a; --bad-s:rgba(255,122,122,.15);
    --blob-op:.45; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"]{
  --accent:var(--acc-d); --text:#eef0f8; --dim:#a9afc2; --faint:#767c8f; --base:#0b0d15;
  --panel:rgba(26,30,44,.58); --panel2:rgba(255,255,255,.07); --glass:rgba(14,16,26,.66);
  --glass-bd:rgba(255,255,255,.14); --hi:inset 0 1px 0 rgba(255,255,255,.08);
  --shadow:0 12px 40px rgba(0,0,0,.5); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.2);
  --good:#5fd18c; --good-s:rgba(95,209,140,.15); --warn:#f2b451; --warn-s:rgba(242,180,81,.15); --bad:#ff7a7a; --bad-s:rgba(255,122,122,.15);
  --blob-op:.45; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--text);background:var(--base);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--blob-op);
  background:
    radial-gradient(900px 620px at 6% -10%, var(--b1), transparent 58%),
    radial-gradient(820px 640px at 108% 8%, var(--b2), transparent 55%),
    radial-gradient(760px 600px at 50% 118%, var(--b3), transparent 58%);}
body::after{content:"";position:fixed;z-index:0;pointer-events:none;width:62vw;height:62vw;right:-22vw;bottom:-28vw;border-radius:50%;filter:blur(50px);opacity:calc(var(--blob-op)*.6);
  background:conic-gradient(from 30deg,transparent,var(--b1),rgba(255,255,255,.5),transparent);animation:drift 32s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(-8vw,-6vh) rotate(24deg)}}
@media (prefers-reduced-motion: reduce){body::after{animation:none}}
#app{position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── ヘッダー（すりガラス） ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);border-bottom:1px solid var(--glass-bd);box-shadow:var(--hi);
  -webkit-backdrop-filter:saturate(170%) blur(var(--frost));backdrop-filter:saturate(170%) blur(var(--frost))}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand{white-space:nowrap;flex:none}
@media (max-width:520px){.top-in{gap:8px;padding-inline:12px}.demo-tag,.brand small,.who .nm{display:none}.hello h1{font-size:24px}}
.brand b{font-family:var(--mincho);font-weight:800;font-size:21px;letter-spacing:.04em}
.brand small{font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:600}
.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);min-width:0}
.who .nm{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.icon-btn{width:36px;height:36px;border-radius:12px;border:1px solid var(--glass-bd);background:var(--panel2);box-shadow:var(--hi);display:grid;place-items:center;cursor:pointer;color:var(--text);flex:none}
.icon-btn svg{width:18px;height:18px}
.tabs{max-width:1100px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid transparent;background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{background:var(--panel);border-color:var(--glass-bd);color:var(--accent);box-shadow:var(--hi),0 4px 14px rgba(0,0,0,.06)}
.tab .dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:6px;padding:0 5px}

/* ── レイアウトとガラスカード ── */
main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;overflow-x:clip}
main.wide{max-width:1320px}
.card{background:var(--panel);border:1px solid var(--glass-bd);border-radius:var(--radius);box-shadow:var(--shadow),var(--hi);padding:18px;
  -webkit-backdrop-filter:blur(var(--frost)) saturate(1.5);backdrop-filter:blur(var(--frost)) saturate(1.5)}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:grid;gap:16px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.hello{padding:4px 2px 2px}
.hello .sub{font-size:13px;color:var(--dim);font-weight:500}
.hello h1{margin:2px 0 0;font-size:28px;line-height:1.2;letter-spacing:-.01em;font-weight:700;text-wrap:balance}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--dim)} .small{font-size:13px}
.demo-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--dim);border:1px dashed var(--line2);border-radius:999px;padding:1px 9px}

/* ── ボタン・入力 ── */
.btn{border:none;border-radius:12px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2);color:var(--accent);border:1px solid var(--glass-bd);box-shadow:var(--hi)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.field{display:grid;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--dim)}
.inp{width:100%;min-width:0;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:16px}   /* 16px未満だと iPhone が入力時に画面を拡大する */
input[type=date].inp{-webkit-appearance:none;appearance:none;min-height:44px;display:block}
textarea.inp{min-height:84px;resize:vertical;line-height:1.55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 1〜5 の段階ボタン */
.cond{display:grid;gap:12px}
.crow{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:center}
.crow .nm{font-weight:600;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:grid;place-items:center;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;font-family:var(--mono);transition:.12s}
.seg input:checked+span{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ends{grid-column:2;display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:-6px}
.rpe{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.rpe span{height:44px;font-size:14px}
.rpe-cap{font-size:13px;color:var(--dim);min-height:1.4em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{position:relative}
.chk input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chk span{display:inline-block;padding:6px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-size:13px;font-weight:600}
.chk input:checked+span{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.chk input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chk.good input:checked+span{background:var(--good-s);border-color:var(--good);color:var(--good)}
.chk.danger input:checked+span{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}
.card.alert{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.card.alert h2{color:var(--bad)}
.seen{margin-top:6px;font-size:12px;font-weight:700;color:var(--good)}
.evcard{display:grid;gap:8px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),color-mix(in srgb,var(--acc-2) 12%,var(--panel)))}
.evcard .k{font-size:13px;font-weight:700;color:var(--dim)}
.evcard .big{font-size:18px;font-weight:600} .evcard .big b{font-size:40px;line-height:1;font-family:var(--mono);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:2px}
.evrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)} .evrow:first-child{border-top:0} .evrow>div{flex:1} .evrow.past{opacity:.55}
.evform{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
@media (max-width:520px){ .crow{grid-template-columns:1fr} .ends{grid-column:1} .rpe{grid-template-columns:repeat(6,1fr)} }

/* 状態チップ */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--dim);white-space:nowrap}
.pill.bad{background:var(--bad-s);color:var(--bad)} .pill.warn{background:var(--warn-s);color:var(--warn)} .pill.good{background:var(--good-s);color:var(--good)} .pill.acc{background:var(--tint);color:var(--accent)}

/* ── コーチ：選手一覧 ── */
.stats{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.stat .v{font-size:30px;font-weight:700;line-height:1.1;font-family:var(--mono)}
.stat .v small{font-size:15px;color:var(--dim);font-weight:500}
.stat .k{font-size:12px;color:var(--dim);font-weight:600}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.stat .v{font-size:22px}.stat{padding:12px}}
.roster{display:grid;gap:0}
.rrow{display:grid;grid-template-columns:minmax(9em,1.3fr) 132px 5.5em 5.5em 7.5em minmax(0,2fr);gap:14px;align-items:center;padding:12px 6px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;border-radius:0}
.rrow:first-of-type{border-top:0}
.rrow:hover{background:var(--tint)}
.rhead{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:default;padding-block:0 8px}
.rhead:hover{background:none}
.rname b{display:block;font-size:15px}
.rname span{font-size:12px;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.num small{color:var(--dim);font-size:11px}
.flags{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:860px){
  .rrow{grid-template-columns:1fr auto;gap:6px 12px}
  .rhead{display:none}
  .rrow .c-spark{grid-row:1/3;grid-column:2}
  .rrow .c-m{display:none}
  .rrow .flags{grid-column:1/-1}
}
.lang-tag{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:1px}

/* 記録リスト */
.entries{display:grid;gap:0}
.ent{display:grid;grid-template-columns:6.5em 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.ent:first-child{border-top:0;padding-top:4px}
.ent .d{font-weight:700;font-size:14px}
.ent .d small{display:block;color:var(--dim);font-weight:500;font-size:12px}
.ent .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.ent p{margin:4px 0 0}
.cmt{margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--tint);font-size:14px}
.cmt b{font-size:12px;color:var(--accent);display:block}
.cform{display:flex;gap:8px;margin-top:8px}
.cform .inp{padding:7px 10px;font-size:16px}
@media (max-width:520px){.ent{grid-template-columns:1fr;gap:4px}}

/* 質問スレッド */
.thread{padding:14px 0;border-top:1px solid var(--line)}
.thread:first-child{border-top:0;padding-top:2px}
.bubble{max-width:560px;padding:9px 13px;border-radius:16px;margin-top:6px;background:var(--panel2);border:1px solid var(--line)}
.bubble.coach{margin-left:auto;background:var(--tint);border-color:transparent}
.bubble .by{font-size:11px;color:var(--dim);font-weight:600}
.thead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

/* チャート */
.chart svg{width:100%;height:auto;display:block}
.chart .t{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chart .t small{color:var(--dim);font-weight:500}

/* ── 設定パネル ── */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,12,20,.28);display:grid;place-items:center;padding:16px}
.sheet-ui{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--glass);border:1px solid var(--glass-bd);border-radius:24px;box-shadow:var(--shadow),var(--hi);padding:20px;
  -webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6)}
.sheet-ui h3{margin:0 0 14px;font-size:18px}
.opt-group{display:grid;gap:8px;margin-bottom:18px}
.segbar{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.segbar button{flex:1;border:0;background:none;padding:7px 8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--dim);cursor:pointer}
.segbar button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12),var(--hi)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.sw{border:0;background:none;padding:0;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--dim);font-weight:600}
.sw i{width:40px;height:40px;border-radius:50%;display:block;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 10px rgba(0,0,0,.15)}
.sw[aria-pressed="true"] i{outline:3px solid var(--text);outline-offset:3px}
.sw input[type=color]{width:40px;height:40px;border:0;border-radius:50%;padding:0;background:none;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--glass);border:1px solid var(--glass-bd);box-shadow:var(--shadow),var(--hi);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6)}

/* ── ログイン ── */
.login{min-height:calc(100vh - 40px);display:grid;place-items:center;align-content:center;padding-inline:16px;padding-block:32px}
.login .card{width:min(420px,100%);padding:26px}
.login h1{font-family:var(--mincho);font-weight:800;font-size:32px;margin:0;letter-spacing:.06em;line-height:1.1}
.login .en{font-size:11px;letter-spacing:.3em;color:var(--dim);font-weight:700}
.acct{display:grid;gap:6px;margin-top:8px}
.acct button{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer;text-align:left}
.acct button span{color:var(--dim)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1.2em}

/* ── 印刷プレビュー（紙） ── */
.sheets{overflow-x:auto;display:grid;gap:22px;justify-content:center;padding-block:4px 20px}
.paper{background:var(--s-paper);color:var(--s-ink);box-shadow:0 18px 50px rgba(20,24,40,.22),0 1px 0 rgba(0,0,0,.04);position:relative;overflow:hidden;font-family:var(--sans);--s-acc:#3552d4}
.paper.a5{width:148mm;height:210mm;padding:11mm 11mm 12mm;font-size:8.6pt;line-height:1.5}
.paper.a4{width:210mm;height:297mm;padding:14mm 14mm 14mm;font-size:9pt;line-height:1.5}
.paper .foot{position:absolute;left:11mm;right:11mm;bottom:6mm;display:flex;justify-content:space-between;font-size:6.8pt;color:var(--s-dim);font-family:var(--mono);letter-spacing:.04em}
.paper.a4 .foot{left:14mm;right:14mm}
.paper h2{font-family:var(--mincho);font-weight:800;font-size:15pt;margin:0 0 3mm;letter-spacing:.04em;display:flex;align-items:baseline;gap:3mm}
.paper h2 small{font-family:var(--mono);font-size:7pt;color:var(--s-acc);letter-spacing:.2em;font-weight:500}
.paper h3{font-size:8.6pt;margin:4mm 0 1.5mm;color:var(--s-acc);letter-spacing:.06em}
.rule{height:1.2pt;background:var(--s-ink);margin:0 0 4mm}
.cover{display:flex;flex-direction:column;height:100%}
.cover .band{height:26mm;margin:-11mm -11mm 0;background:var(--s-acc);position:relative}

const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function b64ToU8(s){const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function pushState(){
  if(!pushSupported())return isIOS&&!standalone()?'ios':'unsupported';
  if(Notification.permission==='denied')return 'denied';
  const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription();
  if(!sub)return 'off';
  const {data}=await sb.from('push_subs').select('endpoint').eq('endpoint',sub.endpoint);   // この人の受け取り先として登録済みか
  return data&&data.length?'on':'off';
}
async function enablePush(){
  const perm=await Notification.requestPermission(); if(perm!=='granted')throw new Error('__'+t('n_denied'));
  const reg=await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
  const j=sub.toJSON(); must(await sb.rpc('claim_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth}));
}
async function disablePush(){
  if(!pushSupported())return; const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription();
  if(sub){await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);if(regLoad().filter(r=>r.key!==curKey()).length===0)await sub.unsubscribe()}
}

/* ---------- 計算 ---------- */
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const nextEvent=aid=>(ST.events||[]).filter(ev=>ev.aids.includes(aid)&&ev.date>=TODAY).sort((x,y)=>x.date.localeCompare(y.date))[0];
function eventMarks(aid,ds){const m=[];(ST.events||[]).forEach(ev=>{if(!ev.aids.includes(aid))return;const i=ds.indexOf(ev.date);if(i>=0)m.push([i,ev.name])});return m}
function streak(aid){let n=0,d=E(aid,TODAY)?TODAY:addDays(TODAY,-1);while(E(aid,d)){n++;d=addDays(d,-1)}return n}
const E=(aid,d)=>ST.entries[aid]&&ST.entries[aid][d];
const score=e=>e?e.sleep+e.energy+e.soreness+e.stress+e.mood:null;
const load=e=>e&&e.min?e.min*e.rpe:0;
function firstDay(aid){const k=Object.keys(ST.entries[aid]||{});return k.length?k.reduce((a,b)=>a<b?a:b):null}
function ramp(aid,d){const f=firstDay(aid);if(!f||dayDiff(f,d)<21)return null;   // 記録が3週間分そろうまでは出さない
  let a=0,c=0;for(let i=0;i<28;i++){const l=load(E(aid,addDays(d,-i)));if(i<7)a+=l;c+=l}return c?(a/7)/(c/28):null}
function baseline(aid,d){const v=[];for(let i=1;i<=14;i++){const s=score(E(aid,addDays(d,-i)));if(s!=null)v.push(s)}return v.length?v.reduce((x,y)=>x+y,0)/v.length:null}
function latestWeight(aid){for(let i=0;i<7;i++){const e=E(aid,addDays(TODAY,-i));if(e&&e.weight)return e.weight}return null}
const unanswered=th=>!th.replies.length||th.replies[th.replies.length-1].from!=='coach';
function flags(aid,L){
  const t=I18N[L], a=acct(aid), f=[], e=E(aid,TODAY);
  { const y=addDays(TODAY,-1), y2=addDays(TODAY,-2), j=a.joined||TODAY;   // 前日の分は次の練習までに書けばよい
    if(!E(aid,y)&&j<=y){ if(!E(aid,y2)&&j<=y2) f.push(['bad',t.f_miss.replace('{n}',2)]); else f.push(['acc',t.f_miss_y]); } }
  if(e){const b=baseline(aid,TODAY),s=score(e);if(b!=null&&s<=b-3)f.push([s<=b-5?'bad':'warn',t.f_drop.replace('{d}',(s-b).toFixed(0))])}
  const rr=ramp(aid,TODAY); if(rr>1.3)f.push([rr>1.5?'bad':'warn',t.f_ramp.replace('{v}',rr.toFixed(2))]);
  const le=e||E(aid,addDays(TODAY,-1)); if(le&&le.pain.length){const p=le.pain.reduce((x,y)=>y.level>x.level?y:x);if(p.level>=2)f.push([p.level>=3?'bad':'warn',t.f_pain.replace('{p}',le.pain.map(q=>ptxt(q,t)).join('・'))])}
  const w=latestWeight(aid); if(w&&a.limit&&w>a.limit)f.push(['warn',t.f_w.replace('{d}',(w-a.limit).toFixed(1))]);
  if(e&&e.head&&e.head.length)f.unshift(['bad',t.f_head.replace('{s}',e.head.map(k=>t.hs[k]).join('・')),10]);
  {const ne=nextEvent(aid);if(ne){const dd=dayDiff(TODAY,ne.date);if(dd<=14)f.push(['acc',t.f_ev.replace('{d}',dd)])}}
  if(e&&attOf(e)==='absent')f.push(['warn',t.f_abs.replace('{r}',e.absReason?t.ar[e.absReason]:t.att_l.absent)]);
  if(e&&attOf(e)==='watch')f.push(['acc',t.f_watch]);
  if(ST.threads.some(th=>th.aid===aid&&unanswered(th)))f.push(['acc',t.f_q]);
  return f;
}
const sev=f=>f.reduce((s,[k,,p])=>s+(p||(k==='bad'?3:k==='warn'?1:0)),0);

function chart(vals,{min,max,kind='line',w=640,h=150,color='var(--accent)',ink='var(--faint)',grid='var(--line)',ref=null,refLabel='',ticks=[],labels=[],fill=true,fs=10,marks=[],mc='var(--acc-2)'}){
  const pl=30,pr=8,pt=8,pb=18,iw=w-pl-pr,ih=h-pt-pb,n=vals.length;
  const x=i=>kind==='bar'?pl+(i+.5)*iw/n:pl+(n===1?iw/2:i*iw/(n-1));
  const y=v=>pt+ih-(Math.max(min,Math.min(max,v))-min)/(max-min)*ih;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img">`;
  ticks.forEach(v=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${grid}" stroke-width="1"/><text x="${pl-5}" y="${y(v)+3.5}" text-anchor="end" font-size="${fs}" fill="${ink}" font-family="IBM Plex Mono,monospace">${v}</text>`});
  labels.forEach(([i,l])=>{s+=`<text x="${x(i)}" y="${h-4}" text-anchor="${i===n-1&&kind!=='bar'?'end':i===0&&kind!=='bar'?'start':'middle'}" font-size="${fs}" fill="${ink}" font-family="IBM Plex Mono,monospace">${l}</text>`});
  marks.forEach(([i,l])=>{s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${pt+ih}" stroke="${mc}" stroke-width="1.4" stroke-dasharray="3 3"/><text x="${x(i)-4}" y="${pt+9}" text-anchor="end" font-size="${fs}" font-weight="700" fill="${mc}">${esc(l)}</text>`});
  if(ref!=null){s+=`<line x1="${pl}" x2="${w-pr}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--bad, #cf3434)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${w-pr}" y="${y(ref)-4}" text-anchor="end" font-size="${fs}" fill="var(--bad, #cf3434)">${esc(refLabel)}</text>`}
  if(kind==='bar'){const bw=Math.max(2,iw/n*.62);vals.forEach((v,i)=>{if(v)s+=`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${pt+ih-y(v)}" rx="${Math.min(3,bw/3)}" fill="${color}" opacity="${i===n-1?1:.72}"/>`})}
  else{
    let seg=[],segs=[];vals.forEach((v,i)=>{if(v==null){if(seg.length)segs.push(seg);seg=[]}else seg.push([x(i),y(v)])});if(seg.length)segs.push(seg);
    segs.forEach(sg=>{const d=sg.map((p,j)=>(j?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
      if(fill&&sg.length>1)s+=`<path d="${d}L${sg[sg.length-1][0]} ${pt+ih}L${sg[0][0]} ${pt+ih}Z" fill="${color}" opacity=".12"/>`;
      s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`});
    const li=vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();
    if(li!=null&&li>=0)s+=`<circle cx="${x(li)}" cy="${y(vals[li])}" r="3.6" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
  }
  return s+'</svg>';
}
function spark(vals,w=132,h=30){
  const mn=5,mx=25,n=vals.length,x=i=>2+i*(w-4)/(n-1),y=v=>h-3-(v-mn)/(mx-mn)*(h-6);
  let d='',on=false;vals.forEach((v,i)=>{if(v==null){on=false;return}d+=(on?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);on=true});
  const li=vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(20)}" y2="${y(20)}" stroke="var(--line)" stroke-dasharray="2 3"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>${li>=0?`<circle cx="${x(li)}" cy="${y(vals[li])}" r="2.8" fill="var(--accent)"/>`:''}</svg>`;
}
function rangeDays(aid,days){const ds=[];for(let i=days-1;i>=0;i--)ds.push(addDays(TODAY,-i));return ds}
function oneChart(aid,L,k,days,big){

function trendCharts(aid,L,days=28){

   <div class="chart"><div class="t">${tt.weight} <small>${esc(a.cls)}</small></div>${chart(ds.map(d=>E(aid,d)?.weight??null),{min:wmin,max:wmax,ticks:[wmin,Math.round((wmin+wmax)/2),wmax],labels,ref:a.limit||null,refLabel:a.limit?tt.limit+' '+a.limit+'kg':'',fill:false,marks})}</div>
  </div></div>`;
}

function athToday(){

      <div class="kpi"><div class="k">${T.wchg}</div><div class="v" style="font-size:9.5pt">${st.w0??'—'}→${st.w1??'—'}</div></div></div>
    ${(()=>{const rr=(ST.runs[aid]||[]).filter(r=>r.day.startsWith(ym));return rr.length?`<h3 style="margin-top:6mm">${T.run_title}</h3><div style="font-size:8pt">${rr.slice().reverse().map(r=>`${md(r.day)}　<b>${fmtTime(r.sec)}</b>`).join('　／　')}</div>`:''})()}
    <h3 style="margin-top:6mm">${T.goals.toUpperCase?T.goals:''}</h3>
    <ul class="goal-list">${[0,1,2].map(i=>`<li><i></i><span>${esc(g.items[i]||'')}&nbsp;</span></li>`).join('')}</ul>
    <div class="pchart" style="margin-top:auto"><div class="t">${T.cond_trend}<small>5–25</small></div>${chart(all.map(d=>d<=TODAY?score(E(aid,d)):null),{...cc,min:5,max:25,ticks:[10,15,20,25],labels:lab,marks:eventMarks(aid,all),mc:acc})}</div>
  </div>`);
  // 2. カレンダー＋グラフ
  const first=dow(all[0]), cells=[];for(let i=0;i<first;i++)cells.push('<div class="c o"></div>');
  all.forEach(d=>{const e=E(aid,d),s=score(e);const col=!e||!e.min&&!s?'#e3e5ea':s>=20?acc:s>=16?hexA(acc,.45):'#d9534f';
    cells.push(`<div class="c"><b>${+d.slice(8)}</b>${e?`<span class="l" ${attOf(e)==='absent'?'style="color:#b86e00;font-weight:600"':''}>${attOf(e)==='absent'?esc(T.att_l.absent):e.min?e.min+"'·"+e.rpe+(attOf(e)==='watch'?' '+esc(T.att_l.watch):''):T.rest}</span><span class="l">${e.weight}</span>${e.pain.length?`<span class="l" style="color:#c0392b">${e.pain.map(p=>esc(ptxt(p,T))).join(' ')}</span>`:''}`:d<=TODAY?`<span class="l">—</span>`:''}<span class="bar" style="background:${d<=TODAY?col:'transparent'}"></span></div>`)});
  const ws=all.map(d=>E(aid,d)?.weight).filter(Boolean), wv=[...ws,...(a.limit?[a.limit]:[])], wmin=Math.floor(Math.min(...(wv.length?wv:[60]))-1), wmax=Math.ceil(Math.max(...(wv.length?wv:[60]))+.5);
  pages.push(`<h2>${T.cal}<small>${T.cal_sub}</small></h2><div class="rule"></div>
    <div class="cal">${I18N[L].wd.map(w=>`<div class="h">${w}</div>`).join('')}${cells.join('')}</div>
    <div class="legend"><span><i style="background:${acc}"></i>${T.lg_good}</span><span><i style="background:${hexA(acc,.45)}"></i>${T.lg_mid}</span><span><i style="background:#d9534f"></i>${T.lg_low}</span><span><i style="background:#e3e5ea"></i>${T.lg_rest}</span></div>
    <div class="pchart"><div class="t">${T.load_trend}<small>${T.load_u}</small></div>${chart(all.map(d=>load(E(aid,d))),{...cc,h:100,min:0,max:1800,kind:'bar',ticks:[0,900,1800],labels:lab,marks:eventMarks(aid,all),mc:acc})}</div>
    <div class="pchart"><div class="t">${T.weight_trend}<small>${a.limit?T.limit+' '+a.limit+'kg':''}</small></div>${chart(all.map(d=>E(aid,d)?.weight??null),{...cc,h:100,min:wmin,max:wmax,ticks:[wmin,wmax],labels:lab,ref:a.limit||null,refLabel:'',fill:false})}</div>`);
  // 3. 日々の記録（1ページ9日ずつ）
  const days=all.filter(d=>d<=TODAY&&E(aid,d)&&(E(aid,d).min||E(aid,d).note||attOf(E(aid,d))==='absent'));
  for(let p=0;p<days.length;p+=9){
    pages.push(`<h2>${T.daily}<small>${T.daily_sub}</small></h2>${days.slice(p,p+9).map(d=>{const e=E(aid,d);
      return `<div class="day"><div class="dt">${fd(d,L)}<small>${e.min?`${e.min}${T.min} · ${T.rpe} ${e.rpe}`:esc(attTxt(e,T)||T.rest)}</small><small>${T.score} ${score(e)} · ${e.weight}kg</small></div>
       <div><div class="mt">${esc(typeTxt(e,L))}${e.pain.length?' · '+e.pain.map(q=>esc(ptxt(q,T))+'('+T.lv[q.level]+')').join(' '):''}${e.head?.length?` · <b style="color:#c0392b">${e.head.map(k=>T.hs[k]).join('・')}</b>`:''}</div><div class="nt">${esc(e.note)}</div>${e.comment?`<div class="cm">${esc(e.comment.text)}</div>`:''}</div></div>`}).join('')}`);
  }
  // 3.5 試合の振り返り（選手が書いたものだけ。コーチの非公開メモは載せない）
  const mevs=(ST.events||[]).filter(e=>e.aids.includes(aid)&&e.date.startsWith(ym)&&e.date<=TODAY).sort((x,y)=>x.date.localeCompare(y.date));
  if(mevs.length)pages.push(`<h2>${T.mr_title}<small>MATCH REVIEW</small></h2><div class="rule"></div>${mevs.map(e=>{const n=ST.mnotes[e.id]||{};
    return `<div class="qa"><div class="dd">${fd(e.date,L)}</div><div class="q">${esc(e.name)}${n.result?'　— '+esc(n.result):''}</div>${[['good',T.mr_good],['issues',T.mr_issues],['next_steps',T.mr_next]].filter(([k])=>n[k]).map(([k,l])=>`<div class="a"><span class="dd">${l}</span><br>${esc(n[k])}</div>`).join('')||`<div class="lines" style="height:22mm"></div>`}</div>`}).join('')}`);
  // 4. 対話
  const qs=ST.threads.filter(th=>th.aid===aid&&th.date.startsWith(ym));
  pages.push(`<h2>${T.dia}<small>${T.dia_sub}</small></h2><div class="rule"></div>${qs.length?qs.map(q=>`<div class="qa"><div class="dd">${fd(q.date,L)}</div><div class="q">Q. ${esc(q.text)}</div>${q.replies.map(r=>`<div class="a"><span class="dd">${r.from==='coach'?T.coach:esc(a.name)} · ${fd(r.date,L)}</span><br>${esc(r.text)}</div>`).join('')}</div>`).join(''):`<p style="color:#5a5f6b">${T.none}</p>`}
    <div class="boxlbl" style="margin-top:5mm">${T.cword}<small>${T.hand}</small></div><div class="lines" style="height:38mm"></div>`);
  // 5. 振り返り（手書き欄）
  pages.push(`<h2>${T.ref}<small>${T.ref_sub}</small></h2><div class="rule"></div>
    ${g.review?`<div class="boxlbl">${T.typed}</div><div class="typed">${esc(g.review)}</div>`:''}
    <div class="boxlbl">${T.good}<small>${T.hand}</small></div><div class="lines" style="height:30mm"></div>
    <div class="boxlbl">${T.issue}<small>${T.hand}</small></div><div class="lines" style="height:30mm"></div>
    <div class="boxlbl">${T.next}<small>${T.hand}</small></div><div class="lines" style="height:${g.review?22:30}mm"></div>
    <div class="signs"><div>${T.sign_a}</div><div>${T.sign_c}</div></div>`);
  return pages.map((p,i)=>`<section class="paper a5" style="--s-acc:${acc}" lang="${L}">${p}${i?foot(i+1):''}</section>`).join('');
}

  const until=inv?fd(localDay(inv.expires_at),L):'';
  if(guardianOf){const n=acct(guardianOf)?.name||'';
    return L==='ja'?`柔道ノート（保護者用）への招待です。\n${n}さんの練習の記録を、見るだけのアカウントで確認できます。\n下のリンクを開いて、IDとパスワードを決めて登録してください（${until}まで有効）。\n${link}`
      :`You’re invited to Judo Note as a parent/guardian.\nYou can view ${n}’s training records (read-only).\nOpen the link below and choose an ID and password to sign up (valid until ${until}).\n${link}`}
  return L==='ja'?`柔道ノートへの招待です。\n下のリンクを開いて、自分のIDとパスワードを決めて登録してください（${until}まで有効）。\n${link}\n\n登録できたら、Safariの「共有」→「ホーム画面に追加」を押すと、アプリのように使えます。`

}

const app=document.getElementById('app');
function render(){
  applyTheme();
  if(UI.booting){app.innerHTML=`<div class="login"><div class="muted">${I18N[UI.loginLang].loading}</div></div>`;return}
  if(!UI.session||!me()){app.innerHTML=loginView();return}
  const m=me();
  app.innerHTML=(m.role==='coach'?coachView():m.role==='guardian'?guardianView():athleteView())+(UI.settings?settingsView():'')+modalView()+accountsSheet();
  if(m.role==='coach'&&UI.sel&&!UI.previewAs)app.querySelector('main')?.classList.add('wide');
  if(UI.previewAs)app.querySelectorAll('main input, main textarea, main select:not([data-act=pym]), main form button, [data-act=evdel]').forEach(el=>el.disabled=true);
  if(m.role==='athlete'&&UI.view==='today'&&UI.draftRestored){toast(t('draft_restored'));UI.draftRestored=false}
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,msg.length>30?5600:2200)}
function errText(e){
  const T=I18N[lang()], m=String(e?.message||e||'');
  if(m.startsWith('__'))return m.slice(2);
  if(/Failed to fetch|NetworkError|network|Load failed/i.test(m))return T.e_net;
  if(/already registered|already exists|User already/i.test(m))return T.e_taken;
  if(/invalid invite/i.test(m))return T.code_bad;
  if(/guardian consent/i.test(m))return T.e_consent;
  if(/team already exists/i.test(m))return T.e_team;
  if(/Invalid login credentials/i.test(m))return T.login_err;
  return T.e_generic.replace('{m}',m);
}
// ほかの人に切り替える前に：親のスマホで使っていた選手のアカウントは、ログアウトしておく（兄弟でも勝手に開けないように）
async function leaveCurrent(){
  const reg=regLoad(), cur=reg.find(r=>r.key===curKey());
  if(cur&&cur.role==='athlete'&&reg.some(r=>r.key!==cur.key)){await sb.auth.signOut({scope:'local'}).catch(()=>{});cur.pw=true;regSave(reg)}
}
// この端末の一覧に、今のアカウントを記録する
function rememberCurrent(key){
  const m=me(); if(!m)return;
  const reg=regLoad().filter(r=>r.key!==key); reg.unshift({key,login:m.login,name:m.name,role:m.role,pw:false}); regSave(reg);
}
async function activate(key,user){   // このアカウントを使う
  sb=clientFor(key); setCurKey(key); await afterSignIn(user); rememberCurrent(key);
}
async function switchTo(login){
  const r=regLoad().find(x=>x.login===login); if(!r)return;
  await leaveCurrent();
  const c=clientFor(r.key), {data}=await c.auth.getSession();
  if(data.session){UI.acctSheet=false;await activate(r.key,data.session.user);toast(t('ac_switched').replace('{n}',r.name));return}
  UI.acctSheet=false;UI.session=null;UI.auth=null;UI.prefill=login;UI.err='';render();document.getElementById('lg-pw')?.focus();   // パスワードが必要
}
async function afterSignIn(user){
  UI.authUser=user; UI.session=user.id;
  await loadAll();
  if(!me()){UI.auth='join';UI.session=user.id;render();return}   // アカウントはあるがチームに未参加
  UI.auth=null;UI.err='';UI.sel=null;UI.view=me().role==='coach'?'team':me().role==='guardian'?'log':'today';
  if(me().role==='guardian')UI.pAid=subject();
  if(me().role==='athlete'){UI.pAid=me().id;const d=!E(me().id,TODAY)&&loadDraft();if(d){UI.draft=d;UI.draftRestored=true}}
  UI.loginLang=prefs(UI.session).lang; render(); window.scrollTo(0,0);
}
async function signOut(){   // 今のアカウントだけをこの端末から外す。ほかの家族のアカウントは残る
  const key=curKey(); await disablePush().catch(()=>{}); await sb.auth.signOut({scope:'local'}).catch(()=>{});
  const reg=regLoad().filter(r=>r.key!==key); regSave(reg);
  Object.assign(UI,{session:null,authUser:null,settings:false,auth:null,acctSheet:false}); ACCOUNTS=[]; ATH=[];
  for(const r of reg){const c=clientFor(r.key),{data}=await c.auth.getSession();if(data.session&&r.role!=='athlete'){await activate(r.key,data.session.user);return}}
  setCurKey('judo-auth-none'); sb=clientFor('judo-auth-none'); render();
}
async function refreshData(){if(!me()||Date.now()-(UI.loadedAt||0)<30000)return;try{await loadAll();if(!document.querySelector('form:focus-within'))render()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshData()});

document.addEventListener('submit',ev=>{
  ev.preventDefault();
  if(UI.previewAs)return;
  const f=ev.target, fid=f.getAttribute('id'), fdt=new FormData(f);
  const LL=UI.loginLang, TT=I18N[LL], showErr=(id,msg)=>{UI.err=msg;const e=document.getElementById(id);if(e)e.textContent=msg};
  if(fid==='login-form'){
    const id=(fdt.get('uid')||'').trim().toLowerCase(), pw=fdt.get('pass')||'';
    if(!id||!pw)return showErr('lg-err',TT.login_err);
    UI.busy=true; const key=keyFor(id), c=clientFor(key);
    c.auth.signInWithPassword({email:idToEmail(id),password:pw}).then(async({data,error})=>{UI.busy=false;if(error)throw error;UI.prefill='';await activate(key,data.user)})
      .catch(e=>{UI.busy=false;showErr('lg-err',errText(e))});
    return;
  }
  if(fid==='join-form'){
    const code=(fdt.get('code')||'').trim().toUpperCase(), name=(fdt.get('name')||'').trim(), minor=!!fdt.get('minor');
    const guardian=(fdt.get('guardian')||'').trim(), consent=!!fdt.get('consent');
    if(minor&&(!guardian||!consent))return showErr('jn-err',TT.e_consent);
    const args={invite_code:code,login:'',name,wclass:(fdt.get('wclass')||'').trim(),wlimit:+fdt.get('wlimit')||null,pref_lang:LL,minor,guardian,consent};
    (async()=>{
      UI.busy=true;
      let user=UI.authUser;
      if(!user){
        const id=(fdt.get('uid')||'').trim().toLowerCase(), pw=fdt.get('pass')||'';
        if(!ID_RE.test(id))throw new Error('__'+TT.e_id); if(pw.length<8)throw new Error('__'+TT.e_pw); if(pw!==fdt.get('pass2'))throw new Error('__'+TT.e_pw2);
        const team=must(await sb.rpc('check_invite',{invite_code:code})); if(!team)throw new Error('invalid invite');
        const key=keyFor(id), c=clientFor(key);   // 新しい人は新しい保存場所で（親のログインはそのまま）
        const {data,error}=await c.auth.signUp({email:idToEmail(id),password:pw}); if(error)throw error;
        if(!data.session)throw new Error('__'+TT.e_conf);
        await leaveCurrent(); sb=c; setCurKey(key); user=data.user; args.login=id;
      }else args.login=(user.email||'').split('@')[0];
      must(await sb.rpc('redeem_invite',args));
      UI.busy=false; UI.join=null; await afterSignIn(user); rememberCurrent(curKey());
    })().catch(e=>{UI.busy=false;const m=String(e?.message||'');showErr('jn-err',m.startsWith('__')?m.slice(2):errText(e))});
    return;
  }
  if(fid==='link-form'){
    const code=(document.getElementById('jn-code')?.value||'').trim().toUpperCase(), id=(fdt.get('uid')||'').trim().toLowerCase(), pw=fdt.get('pass')||'';
    (async()=>{
      UI.busy=true;
      const key=keyFor(id), c=clientFor(key);
      const {data,error}=await c.auth.signInWithPassword({email:idToEmail(id),password:pw}); if(error)throw error;
      const r=await c.rpc('link_child',{invite_code:code});
      if(r.error){await c.auth.signOut({scope:'local'});throw new Error(/guardian only/.test(r.error.message)?'__'+TT.e_not_guardian:r.error.message)}
      UI.busy=false; UI.join=null; UI.child=r.data; await leaveCurrent(); await activate(key,data.user); toast(t('lk_done'));
    })().catch(e=>{UI.busy=false;const m=String(e?.message||'');showErr('lk-err',m.startsWith('__')?m.slice(2):errText(e))});
    return;
  }
  if(fid==='setup-form'){
    const id=(fdt.get('uid')||'').trim().toLowerCase(), pw=fdt.get('pass')||'';
    (async()=>{
      if(!ID_RE.test(id))throw new Error('__'+TT.e_id); if(pw.length<8)throw new Error('__'+TT.e_pw); if(pw!==fdt.get('pass2'))throw new Error('__'+TT.e_pw2);
      UI.busy=true;
      const key=keyFor(id), c=clientFor(key);
      const {data,error}=await c.auth.signUp({email:idToEmail(id),password:pw}); if(error)throw error;
      if(!data.session)throw new Error('__'+TT.e_conf);
      must(await c.rpc('create_team',{team_name:(fdt.get('team')||'').trim(),login:id,name:(fdt.get('name')||'').trim()}));
      UI.busy=false; await activate(key,data.user);
    })().catch(e=>{UI.busy=false;const m=String(e?.message||'');showErr('su-err',m.startsWith('__')?m.slice(2):errText(e))});
    return;
  }
  if(fid==='today-form'){
    const d=formToEntry(fdt); saveDraft(d);
    const day=UI.eday||TODAY, isY=day!==TODAY;
    run(async()=>{await saveEntry(d,day);clearDraft();UI.draft=null;UI.eday=TODAY;window.scrollTo(0,0)},d.head.length?t('head_saved'):isY?t('saved_y'):t('saved'))
      .then(()=>{if(loadDraft())toast(t('offline_saved'))});
    return;
  }
  if(f.dataset.form==='comment'){const v=(fdt.get('c')||'').trim();if(!v)return;run(()=>sendFeedback(f.dataset.aid,f.dataset.d,v),t('sent'))}
  if(f.dataset.form==='reply'){const v=(fdt.get('r')||'').trim();if(!v)return;run(()=>sendReply(f.dataset.id,v),t('sent'))}
  if(f.dataset.form==='ask'){const v=(fdt.get('q')||'').trim();if(!v)return;run(()=>askQuestion(v,false),t('sent'))}
  if(f.dataset.form==='event'){const name=(fdt.get('name')||'').trim(),date=fdt.get('date');if(!name||!date)return;run(()=>addEvent(f.dataset.aid,name,date,fdt.get('weigh')||'',+fdt.get('target')||null),t('ev_added'))}
  if(f.dataset.form==='run'){const sec=(+fdt.get('min')||0)*60+(+fdt.get('sec')||0);if(!sec)return;run(()=>addRun({day:fdt.get('day')||TODAY,dist:null,sec,note:(fdt.get('note')||'').trim()}),t('run_saved'))}
  if(f.dataset.form==='mnote'){const ev=f.dataset.ev;run(async()=>{await saveMNote(ev,{result:(fdt.get('result')||'').trim(),good:(fdt.get('good')||'').trim(),issues:(fdt.get('issues')||'').trim(),next_steps:(fdt.get('next_steps')||'').trim()});UI.mEdit=null},t('mr_saved'))}
  if(f.dataset.form==='cnote'){run(()=>saveCNote(f.dataset.ev,f.dataset.aid,(fdt.get('body')||'').trim()),t('cn_saved'))}
  if(f.dataset.form==='editmsg'){const v=(fdt.get('body')||'').trim();if(!v)return;const id=f.dataset.id;run(async()=>{await editMessage(id,v);UI.msgEdit=null},t('ed_done'))}
  if(f.dataset.form==='editcmt'){const v=(fdt.get('c')||'').trim();if(!v)return;run(async()=>{await editComment(f.dataset.aid,f.dataset.d,v);UI.cmtEdit=null},t('ed_done'))}
  if(f.dataset.form==='goals'){run(()=>saveGoals(curYm(),fdt.getAll('g').map(s=>s.trim()),(fdt.get('review')||'').trim()),t('goals_saved'))}
  if(f.dataset.form==='invite'){run(async()=>{const c=must(await sb.rpc('create_invite',{memo:(fdt.get('memo')||'').trim()}));UI.newInvite=c;await loadAll()})}
  if(f.dataset.form==='cls'){const aid=f.dataset.aid;run(async()=>{must(await sb.from('profiles').update({weight_class:(fdt.get('wclass')||'').trim(),weight_limit:+fdt.get('wlimit')||null}).eq('id',aid));await loadAll()},t('saved_cls'))}
  if(f.dataset.form==='resetpw'){const pw=fdt.get('pw')||'';if(pw.length<8)return toast(t('e_pw'));run(()=>sb.rpc('coach_reset_password',{athlete:f.dataset.aid,new_password:pw}).then(must),t('reset_done_pw'))}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&(UI.settings||UI.modal)){UI.settings=false;UI.modal=null;render()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches?.('[data-act=bigchart]')){ev.preventDefault();ev.target.click()}});

/* ---------- 起動 ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async function boot(){
  const m=/^#join-([A-Za-z0-9]{6,12})$/.exec(location.hash);
  if(m){UI.auth='join';UI.join={code:m[1].toUpperCase()};history.replaceState(null,'',location.pathname)}
  UI.booting=true; render();
  try{
    const {data}=await sb.auth.getSession();
    UI.booting=false;
    if(data.session&&!m){await afterSignIn(data.session.user);rememberCurrent(curKey());return}
    if(m)UI.authUser=null;
  }catch(e){UI.booting=false;UI.err=errText(e)}
  render();
  if(UI.join?.code)document.querySelector('[data-act=checkcode]')?.click();
})();

</script>
</body>
